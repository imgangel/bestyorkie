name: Rename landing page to index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-to-index.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f florida-yorkies-parti-yorkie-puppies.html ]; then
            mv florida-yorkies-parti-yorkie-puppies.html index.html
            git config user.name "imgangel"
            git config user.email "imgangel@users.noreply.github.com"
            git add -A
            git commit -m "Rename landing page to index.html"
            git push
          else
            echo "Source file not found; nothing to do"
          fi
